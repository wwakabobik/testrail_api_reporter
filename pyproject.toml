[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testrail-api-reporter"
dynamic = ["version"]
description = "TestRail API reporter tools: generate and publish test automation coverage reports from TestRail data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Iliya Vereshchagin", email = "i.vereshchagin@gmail.com" },
]
keywords = [
    "api", "automation", "automation-testing", "chart", "confluence", "email",
    "google-drive", "pytest", "pytest-report", "qa", "reporter", "reports",
    "slack", "testing", "testing-tools", "testrail", "testrail-api",
    "testrail-python", "testrail-reporting",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "atlassian-python-api>=5.0.5",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httplib2>=0.32.0",
    "kaleido>=1.5.0",
    "oauth2client>=4.1.3",
    "plotly>=7.1.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "testrail-api>=1.13.6",
    "xmltodict>=1.0.4",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
cohere = ["cohere>=5.0.0"]
anthropic = ["anthropic>=0.40.0"]
ai = ["openai>=1.0.0", "cohere>=5.0.0", "anthropic>=0.40.0"]

[project.urls]
Homepage = "https://github.com/wwakabobik/testrail_api_reporter"
"Bug Tracker" = "https://github.com/wwakabobik/testrail_api_reporter/issues"
"Contribution Guide" = "https://github.com/wwakabobik/testrail_api_reporter/blob/master/CONTRIBUTING.md"

[tool.setuptools.dynamic]
version = { attr = "testrail_api_reporter.__version__" }

[tool.setuptools.packages.find]
include = ["testrail_api_reporter*"]

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = """
    Q000,
    WPS306,
    I001,
    I005,
    WPS229,
    D400,
    WPS317,
    S101,
    WPS507
"""

[tool.pylint]
max-line-length = 120

[tool.pylint.'DESIGN']
max-attributes = 15

[tool.pylint.classes]
min-public-methods = 1

[tool.mypy]

[[tool.mypy.overrides]]
module = "testrail_api.*"
ignore_missing_imports = true
